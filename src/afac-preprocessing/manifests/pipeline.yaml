apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: afac-preprocessing
spec:
  params:
    - name: doc-name
      type: string
      description: Nom du PDF à traiter, sans extension (ex. MonDoc)
    - name: image
      type: string
      default: "afac-preprocessing:latest"
      description: Image conteneur du projet
    - name: formats
      type: string
      default: "doctags json md txt"
      description: "Formats texte à exporter (doctags json md txt). Tables CSV/HTML via --no-tables."
    - name: lang
      type: string
      default: "fr"
    - name: threads
      type: string
      default: "4"
    - name: device
      type: string
      default: "cuda"
    - name: opencv-dpi
      type: string
      default: "150"
    - name: run-opencv-check
      type: string
      default: "false"
      description: "Activer la validation visuelle OpenCV (true/false)"
    - name: vlm-language
      type: string
      default: "french"
      description: "Langue de la réponse VLM"
    - name: vlm-workers
      type: string
      default: "1"
      description: "Nombre de threads VLM parallèles"
    - name: image-description
      type: string
      default: "--no-image-description"
      description: "Activer la description VLM : '--image-description' ou '--no-image-description'"

  workspaces:
    - name: data
      description: PVC partagé — contient input/ et les sorties par stage

  tasks:
    # Stage 1 : OCR + export tous formats
    - name: stage1-ocr-export
      taskRef:
        name: stage1-ocr-export
      params:
        - name: doc-name
          value: $(params.doc-name)
        - name: formats
          value: $(params.formats)
        - name: lang
          value: $(params.lang)
        - name: threads
          value: $(params.threads)
        - name: device
          value: $(params.device)
        - name: image
          value: $(params.image)
      workspaces:
        - name: data
          workspace: data

    # Stage 1b : Réordonnancement DocTags
    - name: stage1-reorder-doctags
      taskRef:
        name: stage1-reorder-doctags
      runAfter: [stage1-ocr-export]
      params:
        - name: doc-name
          value: $(params.doc-name)
        - name: image
          value: $(params.image)
      workspaces:
        - name: data
          workspace: data

    # Stage 1c : CSV -> JSONL (parallèle avec reorder)
    - name: stage1-csv-to-jsonlines
      taskRef:
        name: stage1-csv-to-jsonlines
      runAfter: [stage1-ocr-export]
      params:
        - name: doc-name
          value: $(params.doc-name)
        - name: image
          value: $(params.image)
      workspaces:
        - name: data
          workspace: data

    # Stage 1d : Validation visuelle OpenCV (optionnelle, parallèle)
    - name: stage1-opencv-check
      taskRef:
        name: stage1-opencv-check
      runAfter: [stage1-ocr-export]
      when:
        - input: $(params.run-opencv-check)
          operator: in
          values: ["true"]
      params:
        - name: doc-name
          value: $(params.doc-name)
        - name: dpi
          value: $(params.opencv-dpi)
        - name: image
          value: $(params.image)
      workspaces:
        - name: data
          workspace: data
    
    - name: stage2-load-jsonline-doctags
      taskRef:
        name: stage2-load-jsonline-doctags
      runAfter: [stage1-reorder-doctags, stage1-csv-to-jsonlines]
      params:
        - name: doc-name
          value: $(params.doc-name)
        - name: image
          value: $(params.image)
      workspaces:
        - name: data
          workspace: data

    # Stage 2b : Description images via VLM
    - name: stage2-image-description
      taskRef:
        name: stage2-image-description
      runAfter: [stage2-load-jsonline-doctags]
      params:
        - name: doc-name
          value: $(params.doc-name)
        - name: image
          value: $(params.image)
        - name: language
          value: $(params.vlm-language)
        - name: workers
          value: $(params.vlm-workers)
        - name: image-description
          value: $(params.image-description)
      workspaces:
        - name: data
          workspace: data