apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stage2-image-description
  annotations:
    description: >
      Décrit les images d'un .doctags via VLM avec contexte textuel.
      Remplace les balises <picture> par les descriptions générées.
      Désactivé par défaut (--no-image-description) ; activer avec --image-description.
      Les credentials VLM (VLM_URL, CA_PATH, VLM_MODEL_NAME) sont injectés via un Secret.
spec:
  params:
    - name: doc-name
      type: string
      description: Nom du document sans extension (ex. MonDoc)
    - name: image
      type: string
      default: "afac-preprocessing:latest"
    - name: language
      type: string
      default: "french"
      description: Langue de la réponse VLM
    - name: workers
      type: string
      default: "1"
      description: Nombre de threads VLM parallèles (défaut séquentiel)
    - name: image-description
      type: string
      default: "false"
      description: "Activer la description VLM (true/false)"

  workspaces:
    - name: data
      description: PVC partagé — contient input/ et les sorties par stage

  steps:
    - name: vlm-describe
      image: $(params.image)
      envFrom:
        - secretRef:
            name: vlm-credentials
      command: ["uv", "run", "python", "stage1_modulaire/description_image_context_modulaire.py"]
      args:
        - "--doctags"
        - "$(workspaces.data.path)/stage1/$(params.doc-name)/$(params.doc-name)_reordered_with_tables.doctags"
        - "--pdf"
        - "$(workspaces.data.path)/input/$(params.doc-name).pdf"
        - "--output"
        - "$(workspaces.data.path)/stage2/$(params.doc-name)/$(params.doc-name)_pictures.doctags"
        - "--markdown"
        - "$(workspaces.data.path)/stage2/$(params.doc-name)/$(params.doc-name)_image_descriptions.md"
        - "--images-dir"
        - "$(workspaces.data.path)/stage2/$(params.doc-name)/used_images"
        - "--language"
        - "$(params.language)"
        - "--workers"
        - "$(params.workers)"
        - "$(params.image-description)"
