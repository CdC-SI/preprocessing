apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stage1-reorder-doctags
  annotations:
    description: >
      Réordonne les blocs du .doctags produit par stage1-ocr-export
      par coordonnées y0/x0 via reordered_doctags.py.
      Entrée : <doc-name>.doctags — Sortie : <doc-name>_reordered.doctags
spec:
  params:
    - name: doc-name
      type: string
      description: Nom du document sans extension
    - name: image
      type: string
      default: "afac-preprocessing:latest"

  workspaces:
    - name: data

  steps:
    - name: run
      image: $(params.image)
      command: ["uv", "run", "python"]
      args:
        - stage1_modulaire/reordered_doctags.py
        - --input
        - $(workspaces.data.path)/stage1/$(params.doc-name)/$(params.doc-name).doctags
        - --output
        - $(workspaces.data.path)/stage1/$(params.doc-name)/$(params.doc-name)_reordered.doctags
