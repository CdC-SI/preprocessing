apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stage1-csv-to-jsonlines
  annotations:
    description: >
      Convertit les tables CSV extraites par stage1-ocr-export en fichiers JSONL
      via csv_to_jsonlines_modulaire.py. Ignoré silencieusement si aucun CSV n'est présent.
spec:
  params:
    - name: doc-name
      type: string
      description: Nom du document sans extension
    - name: image
      type: string
      default: "afac-preprocessing:latest"

  workspaces:
    - name: data

  steps:
    - name: run
      image: $(params.image)
      command: ["uv", "run", "python"]
      args:
        - stage1_modulaire/csv_to_jsonlines_modulaire.py
        - --input-dir
        - $(workspaces.data.path)/stage1/$(params.doc-name)/tables
        - --output-dir
        - $(workspaces.data.path)/stage1/$(params.doc-name)/tables
