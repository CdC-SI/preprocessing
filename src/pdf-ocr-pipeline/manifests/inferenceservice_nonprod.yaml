apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: pdf-ocr-pipeline
  annotations:
    # Only the legacy synchronous :predict path needs a long router timeout;
    # it is capped at LEGACY_MAX_PAGES pages. The async /jobs endpoints all
    # return immediately.
    haproxy.router.openshift.io/timeout: 300s
    openshift.io/display-name: pdf-ocr-pipeline
    serving.kserve.io/deploymentMode: RawDeployment
    # model-serving-a (non-prod) has no auth token / gateway auth set up for
    # this service yet, and every other InferenceService in this namespace
    # (embedding-inference, reranker-inference, vlm-inference) already runs
    # with enable-auth "false" — matching that convention here. This also
    # means KServe/ODH will NOT inject the kube-rbac-proxy sidecar in this
    # namespace, so the "--upstream-timeout=30s" 502 issue documented in
    # README.md §5 / RUNBOOK.md §9i does NOT apply here and the imperative
    # patch is NOT needed in model-serving-a — only in model-serving, where
    # enable-auth is "true" and the sidecar is genuinely injected.
    security.opendatahub.io/enable-auth: "false"
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    automountServiceAccountToken: false
    # Matches the convention already used by every other InferenceService in
    # model-serving-a (embedding-inference, reranker-inference,
    # vlm-inference), not model-serving's model-serving-sa.
    serviceAccountName: s3-connection-a-sa
    # ---------------------------------------------------------------------
    # MUST remain exactly 1.
    #
    # The job store, the work queue and the VLM concurrency budget are all
    # held in process. A second replica would:
    #   * double the OCR pressure on the shared VLM (breaking the guarantee
    #     that translation always keeps >= 13 of the 17 sequence slots), and
    #   * route status/result polls to a pod that does not know the job.
    #
    # Scaling out requires an external job store and queue (see Phase 2 notes
    # in README.md).
    # ---------------------------------------------------------------------
    minReplicas: 1
    maxReplicas: 1
    # Never run two pods concurrently, not even briefly during a rollout.
    deploymentStrategy:
      type: Recreate
    model:
      modelFormat:
        name: python
      name: ""
      resources:
        limits:
          cpu: "10"
          memory: 20Gi
        requests:
          cpu: "6"
          memory: 16Gi
      runtime: pdf-ocr-pipeline
      storage:
        # Matches the convention already used by every other InferenceService
        # in model-serving-a (embedding-inference, reranker-inference,
        # vlm-inference uses s3-connection-a / s3-connection-a-sa), not
        # model-serving's s3-connection. Same underlying bucket/creds as
        # model-serving's s3-connection (verified identical
        # AWS_S3_BUCKET/AWS_S3_ENDPOINT/AWS_ACCESS_KEY_ID), just a
        # namespace-local copy of the secret.
        key: s3-connection-a
        path: pdf-ocr-pipeline-v2
