name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ tools/

      - name: Type check (mypy, noyau en strict)
        run: uv run mypy

      # Les tests marqués slow/vlm sont exclus : ils demandent un endpoint VLM
      # réel, indisponible en CI (contrainte C1 — aucun rejeu par cache).
      - name: Tests
        run: uv run pytest -m "not slow and not vlm"
