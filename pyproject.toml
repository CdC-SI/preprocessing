[project]
name = "afac-preprocessing"
version = "1.0.0"
description = "Pipeline de prétraitement de documents PDF avec OCR, structuration, enrichissement VLM et export Markdown."
requires-python = ">=3.11"
# Noyau du pipeline de prétraitement SEULEMENT (lot 5 du refactor) —
# le reste (KG, visualisation, évaluation) vit dans les extras ci-dessous.
dependencies = [
    # Extraction PDF — parsing, OCR
    "docling==2.93.0",
    "easyocr==1.7.2",
    "torch==2.11.0",
    "opencv-python==4.13.0.92",
    "numpy==2.4.4",
    # Tables, JSONL
    "pandas==3.0.2",
    "tabulate==0.10.0",
    "requests==2.33.1",
    "jsonlines==4.0.0",
    # Appels VLM/embedding (client OpenAI-compatible, async)
    "httpx==0.28.1",
    "openai==2.26.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.14.1",
    # Conversion DocTags → Markdown
    "docling-core==2.74.1",
    # Partagé
    "PyMuPDF==1.27.2.3",
    "python-dotenv==1.2.2",
    "certifi==2026.4.22",
    "typer>=0.21.2",
]

[project.optional-dependencies]
kg = [
    "neo4j>=6.2.0",
    "neo4j-graphrag>=1.18.0",
    "spacy==3.8.14",
    "fr-core-news-sm",
    "fr-core-news-md",
    "fr-core-news-lg",
]
viz = [
    "networkx==3.6.1",
    "matplotlib==3.10.0",
    "pyvis==0.3.2",
    "Jinja2==3.1.6",
]
eval = [
    "scikit-learn==1.6.1",
]

[project.scripts]
afac-preprocess = "afac_preprocessing.cli.main:app"

[tool.uv]
system-certs = true

[tool.uv.sources]
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
fr-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.8.0/fr_core_news_lg-3.8.0-py3-none-any.whl" }
# Ajouter ici des sources privées si nécessaire (ex. index interne)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/afac_preprocessing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: test lent (exclu de la CI par défaut)",
    "vlm: test nécessitant un endpoint VLM réel",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RET", "ARG", "PTH", "TID"]
ignore = [
    "E501",    # longueur de ligne — gérée par line-length, pas bloquante
    "B008",    # typer.Option() en défaut d'argument : idiome de la CLI
    "ARG002",  # arguments présents pour respecter un contrat (Protocol, PipelineStep)
    # Les imports internes SONT relatifs par décision d'architecture (§ 2.3 du
    # plan de refactor) : c'est TID251 (sys.path.insert) qu'on veut, pas TID252.
    "TID252",
    # Règles qui exigeraient de réécrire des fonctions déplacées telles quelles
    # au lot 6 (invariant n°1 : le refactor change la structure, pas le corps).
    "PTH123",  # open() vs Path.open() dans le code métier déplacé
    "E741",    # noms de variables courts (l, …) hérités des scripts d'origine
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.path.insert".msg = "Ne jamais bricoler sys.path — utiliser le package afac_preprocessing."

# ⚠ Les 4 dossiers du lot 9 ne sont pas encore refactorés : les exempter,
#    sinon `ruff check src/` échoue sur ~16 sys.path.insert hors périmètre.
[tool.ruff.lint.per-file-ignores]
"src/afac_preprocessing/pipeline_baseline/**" = ["E402", "TID251", "F401", "ARG", "RET", "PTH", "B", "UP", "I"]
"src/afac_preprocessing/retrieval_protocol_evaluation/**" = ["E402", "TID251", "F401", "ARG", "RET", "PTH", "B", "UP", "I"]
"src/afac_preprocessing/neo4j_graphrag_ontology/**" = ["E402", "TID251", "F401", "ARG", "RET", "PTH", "B", "UP", "I"]
"src/afac_preprocessing/graph_url/**" = ["E402", "TID251", "F401", "ARG", "RET", "PTH", "B", "UP", "I"]
# Outils legacy restants du périmètre (migrent au lot 9, décision n°14)
"src/afac_preprocessing/pipeline_preprocessing/**" = ["E402", "TID251", "ARG", "RET", "PTH", "B", "UP"]
# Tests : fixtures pytest et signatures imposées par les Protocols (doubles
# async) produisent des arguments légitimement inutilisés.
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/afac_preprocessing/settings.py",
    "src/afac_preprocessing/workspace.py",
    "src/afac_preprocessing/context.py",
    "src/afac_preprocessing/exceptions.py",
    "src/afac_preprocessing/logging_config.py",
    "src/afac_preprocessing/clients",
    "src/afac_preprocessing/core",
]
