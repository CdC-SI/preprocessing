[project]
name = "afac-preprocessing"
version = "1.0.0"
description = "Pipeline de prétraitement de documents PDF avec OCR, structuration, enrichissement VLM et export Markdown."
requires-python = ">=3.11"
# Noyau du pipeline de prétraitement SEULEMENT (lot 5 du refactor) —
# le reste (KG, visualisation, évaluation) vit dans les extras ci-dessous.
dependencies = [
    # Extraction PDF — parsing, OCR
    "docling==2.93.0",
    "easyocr==1.7.2",
    "torch==2.11.0",
    "opencv-python==4.13.0.92",
    "numpy==2.4.4",
    # Tables, JSONL
    "pandas==3.0.2",
    "tabulate==0.10.0",
    "requests==2.33.1",
    "jsonlines==4.0.0",
    # Appels VLM/embedding (client OpenAI-compatible, async)
    "httpx==0.28.1",
    "openai==2.26.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.14.1",
    # Conversion DocTags → Markdown
    "docling-core==2.74.1",
    # Partagé
    "PyMuPDF==1.27.2.3",
    "python-dotenv==1.2.2",
    "certifi==2026.4.22",
    "typer>=0.21.2",
]

[project.optional-dependencies]
kg = [
    "neo4j>=6.2.0",
    "neo4j-graphrag>=1.18.0",
    "spacy==3.8.14",
    "fr-core-news-sm",
    "fr-core-news-md",
    "fr-core-news-lg",
]
viz = [
    "networkx==3.6.1",
    "matplotlib==3.10.0",
    "pyvis==0.3.2",
    "Jinja2==3.1.6",
]
eval = [
    "scikit-learn==1.6.1",
]

[project.scripts]
afac-preprocess = "afac_preprocessing.cli.main:app"

[tool.uv]
system-certs = true

[tool.uv.sources]
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
fr-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.8.0/fr_core_news_lg-3.8.0-py3-none-any.whl" }
# Ajouter ici des sources privées si nécessaire (ex. index interne)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/afac_preprocessing"]
